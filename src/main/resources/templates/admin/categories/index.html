<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('S.I.L - Gestão de Categorias')}"></head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="container" style="margin-top: 3rem;">
        <h1 style="font-family: 'Outfit', sans-serif;">Gerenciar Categorias</h1>
        <p style="margin-bottom: 2rem; color: var(--cor-text-secondary);" th:text="'Total de categorias cadastradas: ' + ${categories.size()}">Total: 0</p>
        
        <div class="admin-actions" style="margin-bottom: 2rem;">
            <button data-modal-open="category-modal" class="btn">+ Adicionar Nova Categoria</button>
            <a th:href="@{/admin}" class="btn btn-secondary">← Voltar ao Painel Admin</a>
        </div>

        <!-- Modal de Cadastro/Edição de Categoria -->
        <div id="category-modal" class="modal" th:object="${category}" th:classappend="${#fields.hasAnyErrors()} ? 'active' : ''">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modal-title" style="font-family: 'Outfit', sans-serif; color: var(--cor-primary-dark);">Nova Categoria</h2>
                    <button class="modal-close" data-modal-close="category-modal">&times;</button>
                </div>
                
                <form id="category-form" th:action="@{/admin/categories}" th:object="${category}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <input type="hidden" th:field="*{id}" id="category-id">
                    
                    <div class="form-group">
                        <label>Nome da Categoria</label>
                        <input type="text" th:field="*{name}" id="category-name" required placeholder="Ex: Programação Orientada a Objetos">
                        <div style="color: var(--cor-error); font-size: 0.8rem;" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>

                    <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                        <button type="submit" class="btn" style="flex: 1;">Salvar</button>
                        <button type="button" class="btn btn-secondary" style="flex: 1;" data-modal-close="category-modal">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="table-container" style="margin-top: 3rem;">
            <table class="animate-fade">
                <thead>
                    <tr>
                        <th style="width: 70%;">Nome da Categoria</th>
                        <th style="width: 30%;">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cat : ${categories}">
                        <td><strong th:text="${cat.name}">Categoria</strong></td>
                        <td>
                            <div class="action-buttons">
                                <button type="button" 
                                        class="btn btn-small btn-secondary" 
                                        th:onclick="openEditCategoryModal([[${cat.id}]], [[${cat.name}]])">
                                    Editar
                                </button>
                                <a th:if="${#lists.isEmpty(cat.signs)}" th:href="@{/admin/categories/delete/{id}(id=${cat.id})}" class="btn btn-small" style="text-decoration: none; background: var(--cor-error);" data-confirm="Tem certeza que deseja excluir esta categoria?">Remover</a>
                                <button th:unless="${#lists.isEmpty(cat.signs)}" type="button" class="btn btn-small" style="background: var(--cor-text-secondary); opacity: 0.5; cursor: not-allowed;" title="Não é possível remover categorias que possuem sinais associados" disabled>Remover</button>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(categories)}">
                        <td colspan="2" style="text-align: center; padding: 4rem; color: var(--cor-text-secondary);">Nenhuma categoria cadastrada.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <script th:inline="javascript">
        window.openEditCategoryModal = function(id, name) {
            const form = document.getElementById('category-form');
            if (!form) return;

            document.getElementById('modal-title').innerText = 'Editar Categoria';
            if (form.elements['id']) form.elements['id'].value = id || '';
            if (form.elements['name']) form.elements['name'].value = name || '';
            
            // ModalManager da script.js
            ModalManager.open('category-modal', true);
        };
    </script>
</body>
</html>
